<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B85C38">
  <title>Offline · AuraGoal</title>
  <link rel="icon" href="/icons/favicon-32.png">
  <style>
    /* Self-contained on purpose: this page must work with nothing else loaded */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: #FAF6EF; color: #352D29;
      font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center; background: #FFFCF9; border: 1px solid #E8DCCB;
      border-radius: 28px; padding: 32px 24px; box-shadow: 0 1px 2px rgba(53,45,41,.04), 0 10px 24px -14px rgba(53,45,41,.16);
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px; background: #B85C38; display: grid; place-items: center; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    p { margin: 0 0 12px; color: #76685F; line-height: 1.5; font-size: 15px; }
    ul { text-align: left; color: #76685F; font-size: 14px; line-height: 1.5; margin: 0 0 20px; padding-left: 20px; }
    button {
      appearance: none; border: 0; border-radius: 12px; background: #B85C38; color: #fff; font: inherit; font-weight: 800;
      font-size: 15px; padding: 12px 22px; cursor: pointer; min-height: 44px;
    }
    button:hover { background: #9A4929; }
    button:focus-visible { outline: 3px solid #352D29; outline-offset: 3px; }
    .status { margin-top: 14px; font-size: 13px; color: #76685F; min-height: 1.2em; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 32 32"><path d="M16 4l2.4 9.6L28 16l-9.6 2.4L16 28l-2.4-9.6L4 16l9.6-2.4z" fill="#fff"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>AuraGoal needs an internet connection to load your goals, plans and messages, so they are always up to date.</p>
    <ul>
      <li>Nothing you saved is lost. It is all safe on the server.</li>
      <li>This page will reload by itself when you're back online.</li>
    </ul>
    <button type="button" id="retry">Try again</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const status = document.getElementById('status');
    const retry = () => { status.textContent = 'Checking your connection…'; location.reload(); };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
