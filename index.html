<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AuraGoal</title>
  <meta name="description" content="Set goals for the week, month and year, plan your days, and keep your streak with an accountability partner.">
  <!-- Installable app (PWA): see public/manifest.webmanifest and public/sw.js -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F5F7FA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AuraGoal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <!-- Light or dark, and the app colour (with its icon), before anything draws, so the wrong look never flashes.
       Mirrors src/lib/theme.js. -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var c = localStorage.getItem("auragoal.theme");
        var dark = c === "dark" || (c !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        d.setAttribute("data-theme", dark ? "dark" : "light");
        var a = localStorage.getItem("auragoal.accent");
        if (!/^(pink|purple|teal|green|orange|brown|graphite)$/.test(a || "")) a = "blue";
        d.setAttribute("data-accent", a);
        var base = a === "blue" ? "/icons" : "/icons/" + a;
        document.querySelector("link[rel=icon]").setAttribute("href", base + "/favicon-32.png");
        document.querySelector("link[rel=apple-touch-icon]").setAttribute("href", base + "/apple-touch-icon.png");
        document.querySelector("link[rel=manifest]").setAttribute("href", a === "blue" ? "/manifest.webmanifest" : "/manifest-" + a + ".webmanifest");
        if (dark) document.querySelector("meta[name=theme-color]").setAttribute("content", "#17191E");
      } catch (e) { d.setAttribute("data-theme", "light"); d.setAttribute("data-accent", "blue"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
