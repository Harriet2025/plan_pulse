<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AuraGoal</title>
  <meta name="description" content="Set goals for the week, month and year, plan your days, and keep your streak with an accountability partner.">
  <!-- Installable app (PWA): see public/manifest.webmanifest and public/sw.js -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F5F7FA">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AuraGoal">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <!-- Light or dark, and the app colour (with its icon), before anything draws, so the wrong look never flashes.
       Mirrors src/lib/theme.js. -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var c = localStorage.getItem("auragoal.theme");
        var dark = c === "dark" || (c !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        d.setAttribute("data-theme", dark ? "dark" : "light");
        var a = localStorage.getItem("auragoal.accent");
        if (!/^(pink|purple|teal|green|orange|brown|graphite)$/.test(a || "")) a = "blue";
        d.setAttribute("data-accent", a);
        var base = a === "blue" ? "/icons" : "/icons/" + a;
        document.querySelector("link[rel=icon]").setAttribute("href", base + "/favicon-32.png");
        document.querySelector("link[rel=apple-touch-icon]").setAttribute("href", base + "/apple-touch-icon.png");
        document.querySelector("link[rel=manifest]").setAttribute("href", a === "blue" ? "/manifest.webmanifest" : "/manifest-" + a + ".webmanifest");
        if (dark) document.querySelector("meta[name=theme-color]").setAttribute("content", "#17191E");
      } catch (e) { d.setAttribute("data-theme", "light"); d.setAttribute("data-accent", "blue"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root">
    <!-- Shown until the app has loaded (the app replaces it) -->
    <div style="position:fixed;inset:0;display:grid;place-items:center;background:rgb(var(--ivory,245 247 250));font-family:Manrope,system-ui,sans-serif">
      <div style="text-align:center">
        <div style="margin:0 auto;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:rgb(var(--btn,53 106 203));box-shadow:0 10px 24px -10px rgb(var(--btn,53 106 203) / .6)">
          <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4l2.9 8.1L27 15l-8.1 2.9L16 26l-2.9-8.1L5 15l8.1-2.9z" fill="#fff"/></svg>
        </div>
        <p style="margin:14px 0 0;font-size:15px;font-weight:800;color:rgb(var(--charcoal,32 43 56))">AuraGoal</p>
        <div style="margin:12px auto 0;width:120px;height:3px;border-radius:3px;background:rgb(var(--oat,216 224 234));overflow:hidden">
          <div style="width:40%;height:100%;border-radius:3px;background:rgb(var(--btn,53 106 203));animation:ag-load 1.1s ease-in-out infinite"></div>
        </div>
      </div>
    </div>
    <style>@keyframes ag-load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}@media (prefers-reduced-motion:reduce){#root div{animation:none!important}}</style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
